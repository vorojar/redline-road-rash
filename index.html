<title>REDLINE • 公路狂徒 · 在线试玩</title>

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#101713;color:#ded9c6;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}#launch{overflow:auto}#rotate{position:fixed;inset:0;z-index:5;background:#101713;display:grid;place-content:center;text-align:center;padding:30px}#rotate strong{font-size:28px;color:#ded9c6}#rotate p{font-size:17px}@media(max-height:500px){#launch{padding:16px 28px!important}.panel{max-width:880px!important}h1{font-size:42px!important;margin:2px 0!important}h2{margin:0 0 8px!important}.panel>p{margin:6px 0;line-height:1.5}.keys{margin-top:10px!important;padding-top:8px!important}.links{margin-top:8px!important}button{margin-top:8px!important;padding:12px 24px!important}}#launch{position:fixed;inset:0;display:grid;place-items:center;background:#101713;z-index:2;padding:24px}.panel{max-width:580px;width:100%}.eyebrow{color:#b6a15a;letter-spacing:.23em;font-size:12px}h1{font-size:clamp(46px,10vw,76px);font-weight:800;letter-spacing:-.05em;margin:12px 0 0}h2{font-size:21px;font-weight:400;color:#b5b8ab;margin:2px 0 28px}p{line-height:1.8;color:#a8afa2}button{border:0;border-radius:3px;padding:17px 30px;background:#a5352b;color:#fff3df;font:700 18px system-ui;cursor:pointer;width:100%;margin-top:16px}button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible{outline:2px solid #c6af65;outline-offset:4px}progress{display:block;width:100%;height:8px;accent-color:#b6a15a;margin:20px 0 8px}#status{font-size:14px;min-height:24px}.keys{font-size:13px;line-height:1.9;border-top:1px solid #384037;margin-top:26px;padding-top:18px}a{color:#b6a15a;text-underline-offset:4px}.links{display:flex;gap:22px;font-size:13px;margin-top:20px}[hidden]{display:none!important}.hint{font-size:12px;color:#858d80}#error{white-space:pre-wrap;color:#f0a194;max-height:120px;overflow:auto;font-s <body>
<canvas id="canvas" tabindex="0" aria-label="REDLINE 摩托竞速游戏"></canvas>
<div id="rotate" hidden><strong>请横屏握持手机或平板</strong><p>横屏后即可进入游戏。比赛中旋转屏幕会自动暂停。</p></div>
<section id="launch"><div class="panel">
<div class="eyebrow">HIGHWAY COMBAT / v0.5</div><h1>REDLINE</h1><h2>公路狂徒</h2>
<p>弯道之前收油，出弯抢回位置。<br>三款摩托、两条公路，一路竞速与近身格斗。</p>
<button id="play" type="button">进入游戏 · 开启声音</button>
<progress id="progress" max="100" value="0" hidden></progress><div id="status" role="status"></div><div id="error" role="alert" hidden></div>
<div class="keys" id="keys">WASD / 方向键驾驶 · J 拳击 · K 踢击 · L 武器<br>U 格挡 · I 闪避 · O 夺械 · Shift 蓄力后松开冲刺 · Esc 暂停</div>
<p class="hint">手机 / 平板横屏触控，电脑键盘操作 · 首次下载约 33 MB（含浏览器传输压缩），请稍候。进度保存在当前浏览器；清除网站数据会删除存档。</p>
<div class="links"><a href="https://github.com/vorojar/redline-road-rash" target="_blank" rel="noopener">项目源码</a><a href="credits.html" target="_blank" rel="noopener">素材与授权</a></div>
<noscript>请启用 JavaScript 后再打开游戏。</noscript>
</div></section>
<script src="index.js"></script>
<script>
window.redlineTouchDevice=navigator.maxTouchPoints>0 && (matchMedia('(pointer:coarse)').matches || /Android|iPhone|iPad/.test(navigator.userAgent));
const canvas=document.getElementById('canvas');
if(window.redlineTouchDevice) document.getElementById('keys').textContent='自动油门 · 摇杆转向 · 拳头攻击 · 圆盘刹车 · 盾牌格挡 · 按住闪电，蓄满松开冲刺';
function suspendGame(){if(window.redlineSuspend) window.redlineSuspend();}
function fitGame(){
 const portrait=window.redlineTouchDevice && innerHeight>innerWidth;
 document.getElementById('rotate').hidden=!portrait;
 if(portrait) suspendGame();
}
addEventListener('resize',fitGame);addEventListener('orientationchange',suspendGame);
addEventListener('blur',suspendGame);addEventListener('pagehide',suspendGame);
// Some Web exports report touchcancel as a normal release. Clear it before Godot receives it.
canvas.addEventListener('touchcancel',suspendGame,{capture:true,passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)suspendGame();});
canvas.addEventListener('contextmenu',event=>event.preventDefault());
fitGame();
const config={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.wasm":39514754,"redline-62d5b174cac1cbc1.pck":22664848},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"mainPack":"redline-62d5b174cac1cbc1.pck"};
// Cap UI resolution; Godot scales the 3D scene separately to keep text sharp.
if(window.redlineTouchDevice) config.canvasResizePolicy=0;
const engine=new Engine(config);
function sizeTouchCanvas(){
 if(!window.redlineTouchDevice)return;
 const safe=document.createElement('div');safe.style.cssText='position:fixed;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';document.body.appendChild(safe);
 const computed=getComputedStyle(safe);const top=parseFloat(computed.paddingTop)||0,right=parseFloat(computed.paddingRight)||0,bottom=parseFloat(computed.paddingBottom)||0,left=parseFloat(computed.paddingLeft)||0;safe.remove();
 const width=Math.max(1,innerWidth-left-right),height=Math.max(1,innerHeight-top-bottom);
 canvas.style.position='fixed';canvas.style.left=left+'px';canvas.style.top=top+'px';canvas.style.width=width+'px';canvas.style.height=height+'px';
 const ratio=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);
}
sizeTouchCanvas();addEventListener('resize',sizeTouchCanvas);
const play=document.getElementById('play'), status=document.getElementById('status'), progress=document.getElementById('progress');
play.addEventListener('click',async()=>{
 play.disabled=true;
 const missing=Engine.getMissingFeatures({threads:false});
 if(missing.length){fail(new Error('浏览器缺少所需支持：'+missing.join(', ')+'。请使用支持 WebGL 2 的 Safari、Chrome、Edge 或 Firefox。'));return;}
 progress.hidden=false;status.textContent='正在下载游戏…';
 try{
  await engine.startGame({onProgress:(current,total)=>{if(total>0){progress.value=current/total*100;status.textContent=current>=total?'正在准备赛道和车辆，请稍候…':`正在下载游戏… ${Math.round(current/total*100)}%`;}},onExit:()=>location.reload()});
  document.getElementById('launch').hidden=true;document.getElementById('canvas').focus();document.body.dataset.gameReady='true';fitGame();
 }catch(error){fail(error);}
});
function fail(error){console.error(error);status.textContent='游戏未能加载';const output=document.getElementById('error');output.hidden=false;output.textContent=String(error.message||error);play.disabled=false;play.textContent='重新载入';play.onclick=()=>location.reload();}
</script>
</body>
